services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luma
      POSTGRES_USER: ${DB_USERNAME:-luma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d luma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: